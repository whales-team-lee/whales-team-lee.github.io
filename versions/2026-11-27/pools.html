<main><section class="chart" aria-label="대한민국 다이빙풀 지도"><svg id="map" role="group" aria-label="시도 및 다이빙풀 위치"></svg><div class="map-tools"><button id="plus" aria-label="지도 확대">+</button><button id="minus" aria-label="지도 축소">−</button><button id="locate" aria-label="내 위치 주변 보기" title="내 위치 주변 보기"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 1v4m0 14v4M1 12h4m14 0h4"/></svg></button></div><output id="location-status" role="status"></output><small id="credit"></small></section>

<dialog id="details"><article><button class="close" aria-label="닫기">×</button><div id="info"></div><div id="gallery"></div></article></dialog><script>(() => {
  const css=document.createElement('style')
  css.textContent=`
    .wh-gallery { display:grid; gap:8px; color:inherit; text-align:left }
    .wh-gallery button,.wh-dialog button { min-height:36px; font:inherit; cursor:pointer; border:1px solid #b6c8c8; background:#fff; color:#174d79; border-radius:6px; padding:5px 11px }
    .wh-gallery .wh-register { justify-self:end; font-size:14px }
    .wh-photo-frame { display:grid; position:relative; place-items:center; overflow:hidden; border-radius:8px; min-height:82px; background:rgba(112,142,141,.1); color:inherit; font-size:14px }
    .wh-photo-frame>img { width:100%; max-height:230px; object-fit:cover; display:block }
    .wh-photo-frame .wh-more { position:absolute; bottom:8px; right:8px; color:white; background:rgba(13,36,42,.88); border:0 }
    .wh-frame-open { width:100%; padding:0!important; border:0!important; background:transparent!important; display:block; cursor:zoom-in!important }
    .wh-frame-open img { display:block; width:100%; max-height:230px; object-fit:cover }
    .wh-dialog { border:1px solid #bac9ca; border-radius:14px; background:#fafcfb; color:#174d79; padding:18px; max-width:min(92vw,680px); max-height:85dvh; box-sizing:border-box; margin:auto }
    .wh-dialog::backdrop { background:rgba(7,26,34,.72) }
    .wh-dialog header { display:flex; align-items:center; justify-content:space-between; position:static; gap:20px; margin:0 0 14px; padding:0; background:none; border:0; width:auto;height:auto }
    .wh-dialog h3 { font-size:18px; margin:0 }
    .wh-dialog img { display:block; width:100%; max-height:52dvh; object-fit:contain }
    .wh-dialog label { display:flex; align-items:center; gap:8px; margin:12px 0; font-size:15px }
    .wh-dialog label input[type=checkbox] { width:18px; height:18px; flex:none }
    .wh-dialog input[type=file] { display:block; width:100%; font:inherit; margin:12px 0 }
    .wh-dialog footer { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:12px 0 0; padding:0; background:none; position:static }
    .wh-dialog .wh-submit { background:#205f90; color:white }
    .wh-dialog button:disabled { opacity:.47; cursor:default }
    .wh-message { font-size:14px; margin:0; color:inherit }
    .wh-message:empty { display:none }
  `
  document.head.append(css)
  function node(tag,text,cls) { const el=document.createElement(tag); if(text)el.textContent=text;if(cls)el.className=cls;return el }
  function button(text,fn,cls) { const el=node('button',text,cls); el.type='button';el.onclick=fn;return el }
  function modal(title) {
    const dialog=node('dialog',null,'wh-dialog')
    dialog.setAttribute('aria-label',title)
    const header=node('header'), heading=node('h3',title)
    header.append(heading,button('닫기',()=>dialog.close()))
    dialog.append(header)
    document.body.append(dialog)
    dialog.addEventListener('close',()=>dialog.remove(),{once:true})
    dialog.showModal()
    return {dialog,heading}
  }
  async function request(pool, options = {}) {
    let db;
    try {
      db = await new Promise((resolve,reject)=>{
        const req=indexedDB.open('whales-pool-photos-v1',1);
        req.onupgradeneeded=()=>req.result.createObjectStore('pools');
        req.onsuccess=()=>resolve(req.result);
        req.onerror=()=>reject(req.error);
      });
    } catch { throw Error('사진을 저장하려면 브라우저에서 파일을 열고 저장공간을 허용해 주세요.'); }
    try {
      return await new Promise((resolve,reject)=>{
        const tx=db.transaction('pools',options.method?'readwrite':'readonly');
        const store=tx.objectStore('pools'), read=store.get(pool);
        let result=[], message='';
        read.onsuccess=()=>{
          const list=read.result || [];
          if(options.method==='POST'){
            if(list.length>=4){message='사진은 4장까지 등록할 수 있습니다.';tx.abort();return;}
            if(!['image/jpeg','image/png','image/webp'].includes(options.body.type)){message='JPG, PNG 또는 WebP 사진을 선택해 주세요.';tx.abort();return;}
            list.push({id:crypto.randomUUID(),file:options.body});store.put(list,pool);
          }else if(options.method==='DELETE'){
            store.put(list.filter(item=>item.id!==options.id),pool);
          }else result=list;
        };
        tx.oncomplete=()=>resolve(result);
        tx.onabort=()=>reject(Error(message || '사진 저장 공간을 확인해 주세요.'));
      });
    } finally {db.close();}
  }
  let releaseUrls=()=>{};
  window.showPhotos = function(container,poolId) {
    const base=poolId
    const root=node('div',null,'wh-gallery'), frame=node('div',null,'wh-photo-frame'), message=node('p',null,'wh-message')
    message.setAttribute('role','status')
    releaseUrls(); let pictures=[]; releaseUrls=()=>pictures.forEach(p=>URL.revokeObjectURL(p.url))
    const register=button('사진 등록',choose,'wh-register')
    root.append(frame,register,message); container.replaceChildren(root)
    register.hidden=true
    frame.textContent='사진 불러오는 중'
    async function refresh() {
      try {
        const saved=await request(base); if(!root.isConnected)return
        releaseUrls(); pictures=saved.map(item=>({id:item.id,url:URL.createObjectURL(item.file)}))
        frame.replaceChildren()
        message.textContent=''
        if(!pictures.length)frame.textContent='사진 준비 중'
        else {
          const open=button('',()=>view(0),'wh-frame-open'), img=node('img')
          img.src=pictures[0].url;img.alt='시설 대표 사진';open.append(img);frame.append(open)
          if(pictures.length>1)frame.append(button('사진 더보기 +'+(pictures.length-1),()=>view(1),'wh-more'))
        }
        register.hidden=pictures.length>=4
      }catch(err){frame.textContent=err.message;register.hidden=true;frame.append(button('다시 시도',refresh))}
    }
    function choose() {
      const {dialog}=modal('사진 등록')
      const remain=4-pictures.length, note=node('p','JPG · PNG · WebP / 장당 8MB / 추가 가능 '+remain+'장'), file=node('input')
      file.type='file';file.accept='image/jpeg,image/png,image/webp';file.multiple=remain>1;file.setAttribute('aria-label','시설 사진 파일')
      const label=node('label'), original=node('input');original.type='checkbox'
      label.append(original,document.createTextNode('제가 직접 촬영한 시설 사진입니다.'))
      const feedback=node('p',null,'wh-message');feedback.setAttribute('role','status')
      const submit=button('등록하기',upload,'wh-submit')
      const enable=()=>{submit.disabled=!original.checked||file.files.length===0||file.files.length>remain;feedback.textContent=file.files.length>remain?'사진은 '+remain+'장까지 선택할 수 있습니다.':''}
      original.onchange=file.onchange=enable;enable()
      async function upload() {
        const files=Array.from(file.files)
        if(!original.checked || !files.length || files.length>remain)return
        if(files.some(f=>f.size>8*1024*1024)){feedback.textContent='8MB 이하의 파일을 선택해주세요.';return}
        submit.disabled=true;file.disabled=true;original.disabled=true
        let count=0
        try{
          for(const photo of files){
            feedback.textContent='사진 등록 중 ('+(count+1)+'/'+files.length+')'
            await request(base,{method:'POST',headers:{'X-Original-Photo':'yes','Content-Type':photo.type},body:photo});count++
          }
          dialog.close()
          await refresh()
        } catch(err){
          // The server may already have accepted some files in this batch.
          await refresh()
          dialog.close()
          message.textContent=(count?count+'장 등록됨. ':'')+err.message
        }
      }
      dialog.append(note,file,label,submit,feedback)
    }
    function view(index) {
      const {dialog,heading}=modal('시설 사진'), img=node('img'), footer=node('footer'), error=node('p',null,'wh-message')
      error.setAttribute('role','status')
      const previous=button('이전',()=>render(index-1)), next=button('다음',()=>render(index+1))
      const remove=button('사진 삭제',async()=>{
        if(!window.confirm('이 사진을 삭제할까요?'))return
        remove.disabled=true
        try{await request(base,{method:'DELETE',id:pictures[index].id});dialog.close();await refresh()}
        catch(err){error.textContent=err.message;remove.disabled=false}
      })
      footer.append(previous,remove,next);dialog.append(img,footer,error)
      function render(n){if(n<0||n>=pictures.length)return;index=n;img.src=pictures[index].url;img.alt='시설 사진 '+(index+1);heading.textContent='시설 사진 '+(index+1)+' / '+pictures.length;previous.disabled=index===0;next.disabled=index===pictures.length-1}
      dialog.addEventListener('keydown',e=>{if(e.key==='ArrowRight')render(index+1);else if(e.key==='ArrowLeft')render(index-1)})
      render(index)
    }
    return refresh()
  }
})()
