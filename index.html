function tlogAdd(title,phases,el,urges,done){const L=jget('wr_tlog',[]),rounds=new Set(phases.filter(p=>p.round).map(p=>p.round)).size,hold=phases.filter(p=>p.kind==='hold').reduce((a,p)=>a+p.sec,0);

function swSessions(){const H='static.stopwatch.session.',it=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(H)){try{const x=JSON.parse(localStorage.getItem(k));if(x&&Array.isArray(x.marks))it.push(x)}catch(e){}}}return it.sort((a,b)=>b.started-a.started)}
const mm2=sec=>{sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')};
function tlogView(){const S=swSessions(),T=jget('wr_tlog',[]),best=S.reduce((m,x)=>Math.max(m,x.duration||0),0);
  const dt=t=>new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  const all=[...S.map(x=>({at:x.started,h:`<details class="ent"><summary><span class="tg">STATIC</span>${dt(x.started)} · <b>${mm2(x.duration)}</b> · 호흡충동 ${x.marks.length}회</summary><ul class="laps">${x.marks.map((v,i)=>`<li>${i+1}번째 <b>${mm2(v)}</b></li>`).join('')||'<li>기록 없음</li>'}</ul></details>`})),
    ...T.map(x=>({at:x.at,h:`<div class="ent tl"><span class="tg ${/O2/.test(x.t)&&!/CO2/.test(x.t)?'o2':'co2'}">${ESC(x.t.replace(/\s*테이블.*/,''))}</span>${dt(x.at)} · ${x.rounds}라운드 · ${x.done?'완료':'중단 '+mm2(x.el)} · 호흡충동 ${x.urges}회</div>`}))].sort((a,b)=>b.at-a.at);
  return `<div class="q">훈련기록</div><div class="aqs"><span><b>${best?mm2(best):'-'}</b>STA 최고</span><span><b>${S.length}</b>스톱워치</span><span><b>${T.length}</b>CO2·O2</span></div>${all.length?all.map(x=>x.h).join(''):'<p class="shint">아직 기록이 없어요. 레인풀장에서 스톱워치나 CO2·O2 테이블을 해 보세요.</p>'}`}
