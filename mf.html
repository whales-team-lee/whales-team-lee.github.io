<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#DBF3FF">
<title>마우스필 계산기 · 웨일스다이빙</title>
<style>
  :root{
    --sky:#DFF4FF; --sky2:#F4FBFF;
    --ink:#123A4B; --ink2:#3E6373; --muted:#8AA6B2;
    --aqua:#12BEBB; --aquasoft:#E1F8F7;
    --blue:#37B0E6; --bluesoft:#E4F4FD;
    --coral:#FF7A66; --coralsoft:#FFEDE9;
    --sun:#FFC94D;
    --card:#FFFFFF; --line:#E6F1F5;
    --sans:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:var(--sans);color:var(--ink);
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 34%,#fff 100%) fixed;
    -webkit-font-smoothing:antialiased;padding-bottom:44px}
  .wrap{max-width:460px;margin:0 auto;padding:0 18px}

  header{text-align:center;padding:26px 18px 10px}
  h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.02em}

  .card{background:var(--card);border-radius:24px;padding:20px 18px;margin-top:16px;
    box-shadow:0 14px 34px -22px #1E5C7333, 0 2px 6px -3px #1E5C7322}
  .step{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:4px}
  .num{width:24px;height:24px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;
    font-size:13px;color:#fff;font-weight:800}
  .record{background:#fff3e5;color:#753809}
  .n1{background:#bc500a} .n2{background:#1968a3}
  .q{font-size:14px;margin:8px 0 14px;color:var(--ink2)}
  .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .field{background:white;border:1px solid #efc49f;border-radius:14px;padding:10px;min-width:0}
  .lab{display:block;font-size:12px;font-weight:700;color:#884210;margin-bottom:6px}
  .bigin{display:flex;gap:3px;align-items:baseline}
  .bigin input,.val{font:800 clamp(17px,5vw,24px)/1.3 var(--sans);color:#a04608}
  .bigin input{width:100%;min-width:0;border:0;border-bottom:1px solid #cd925f;background:transparent;border-radius:0}
  .val{white-space:nowrap}
  .tip,.warning{font-size:13px;line-height:1.6}
  .tip{color:#854410;margin-top:8px}
  .tip:empty{display:none}
  .depth{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px;background:#edf7ff;padding:14px;border-radius:16px}
  .scale{display:flex;gap:2px;align-items:stretch}
  .ticks{display:flex;flex-direction:column;justify-content:space-between;font-size:12px;color:#315b77;padding:5px 0}
  .slider-wrap{position:relative;width:44px;height:172px}
  #revCharge{position:absolute;inset:0;touch-action:none;cursor:pointer}
  #revCharge::before{content:"";position:absolute;inset:0 auto 0 17px;width:10px;border-radius:10px;background:linear-gradient(#88c9ff,#135c9a)}
  #revCharge span{position:absolute;left:22px;top:var(--position,28%);width:24px;height:24px;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #1764a1;background:white;pointer-events:none}
  .readouts{color:#174f7b;font-weight:700;font-size:14px}
  .readouts output{display:block;font-size:clamp(19px,5vw,26px);margin-top:4px}
  .answer{margin-top:12px;border-top:1px solid #b9d6ea;padding-top:12px}
  #reachOut{font-size:clamp(23px,6vw,32px)}
  .warning{background:#fff0f0;color:#a01821;border:1px solid #edb1b4;border-radius:12px;padding:12px;margin:12px 0 0;word-break:keep-all}
  .poster-note{min-height:48px;margin:12px 0 0;font-size:14px;line-height:1.6}
  .seminars{margin-top:20px}
  .seminars h2{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:15px;color:#203540}
  .ad{padding:1px 6px;border:1px solid #9eafbd;border-radius:5px;font-size:10px;color:#617487}
  .posters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .poster{position:relative;display:grid;align-content:center;justify-items:center;gap:8px;aspect-ratio:4/5;margin:0;overflow:hidden;border:2px dashed #9abbd4;border-radius:12px;background:#f5f8fb;color:#203540;font-size:14px}
  .poster small{color:#607588;font-size:clamp(9px,2.8vw,11px);font-weight:700}
  .poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:white;display:none}
  .poster.ready{border:0}
  .poster.ready img{display:block}
  .hidden{display:none}
  .poster-hit{position:absolute;inset:0;width:100%;border:0;background:transparent;cursor:pointer}
  .poster-hit:focus-visible{outline:3px solid #fff;outline-offset:-5px}
  .poster-status{text-align:center;font-size:13px;color:#315b77;margin:6px 0 0}
</style>
</head>
<body>

<header>
  <h1>마우스필 계산기</h1>
</header>

<div class="wrap">

  <div class="card record">
    <div class="step"><span class="num n1">1</span> 수면 마우스필 압력비</div>
    <div class="q" id="recordHelp">수면에서 풀 차징 후 도달한 수심</div>
    <div class="pair">
      <div class="field">
        <label class="lab" for="testDepth">도달 수심</label>
        <div class="bigin"><input type="text" id="testDepth" inputmode="decimal" placeholder="예: 15" aria-describedby="recordHelp hint"><span>m</span></div>
      </div>
      <div class="field"><label class="lab" for="ratioOut">압력비</label><output class="val" id="ratioOut" for="testDepth">—</output></div>
    </div>
    <div class="tip" id="hint" aria-live="polite"></div>
  </div>
  <div class="card">
    <div class="step"><span class="num n2">2</span> 차징 수심별 환산 수심</div>
    <div class="q">해수에서는 10 m마다 약 1기압이 증가합니다.</div>
    <div class="depth">
      <div class="scale">
        <div class="slider-wrap"><div id="revCharge" role="slider" tabindex="0" aria-label="충전 수심" aria-orientation="vertical" aria-valuemin="5" aria-valuemax="30" aria-valuenow="12"><span></span></div></div>
        <div class="ticks" aria-hidden="true"><span>5 m</span><span>30 m</span></div>
      </div>
      <div class="readouts">
        <label for="revCharge">충전 수심</label><output id="revChargeVal" for="revCharge">약 12 m</output>
        <div class="answer">이론상 도달 수심<output id="reachOut" for="testDepth revCharge">—</output></div>
      </div>
    </div>
    <p class="warning"><span role="img" aria-label="경고">⚠️</span> 이 결과는 이론상 추정값입니다. 실제 압력평형이 가능한 수심은 공기량, 컨디션, 환경 등에 따라 달라질 수 있습니다. 이 값을 목표 수심이나 안전 한계로 삼지 마세요. 반드시 전문가와 함께 하세요.</p>
  </div>
  <section class="seminars" aria-labelledby="seminarTitle">
    <h2 id="seminarTitle">세미나 <span class="ad">광고</span></h2>
    <div class="posters">
      <div><figure class="poster ready">
        <img src="sem1.webp?v=1126" alt="세부 딥다이빙 포스터">
      <button class="poster-hit" type="button" data-url="" aria-label="세부 딥다이빙 포스터"></button></figure><p class="poster-status" role="status"></p></div>
      <div><figure class="poster ready">
        <img src="sem2.webp?v=1126" alt="마우스필 세미나 포스터">
      <button class="poster-hit" type="button" data-url="" aria-label="마우스필 세미나 포스터"></button></figure><p class="poster-status" role="status"></p></div>
    </div>
    <p class="poster-note"><!-- 포스터 아래에 표시할 글을 여기에 입력하세요. --></p>
  </section>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const P=d=>d/10+1, Dp=p=>(p-1)*10;
function depthLabel(value){
  const rounded = Math.round(Number(value.toFixed(10)));
  return '약 ' + rounded;
}

function refresh(){
  const input = $("#testDepth");
  const raw = input.value.trim();
  const depth = Number(raw.replace(",", "."));
  $("#revChargeVal").textContent = "약 " + rc + " m";

  if (!/^\d+(?:[.,]\d*)?$/.test(raw) || depth < 1 || depth > 40 || !Number.isInteger(depth * 2)) {
    $("#hint").textContent = raw
      ? "1~40 m 범위에서 0.5 m 단위로 입력해 주세요."
      : "";
    for (const id of ["ratioOut", "reachOut"]) {
      $("#" + id).textContent = "—";
    }
    return;
  }

  const ratio = P(depth);
  $("#hint").textContent = "";
  $("#ratioOut").textContent = "약 " + Number(ratio.toFixed(2)) + "배";
  $("#reachOut").innerHTML = depthLabel(Dp(P(rc) * ratio)) + " <small>m</small>";
}

const slider = $("#revCharge");
let rc = 12;

function selectDepth(value){
  rc = Math.max(5, Math.min(30, Math.round(value * 2) / 2));
  slider.style.setProperty("--position", ((rc - 5) / 25 * 100) + "%");
  slider.setAttribute("aria-valuenow", rc);
  slider.setAttribute("aria-valuetext", rc + " m");
  refresh();
}

function selectPointer(event){
  const bounds = slider.getBoundingClientRect();
  selectDepth(5 + 25 * (event.clientY - bounds.top) / bounds.height);
}

slider.addEventListener("pointerdown", event => {
  slider.setPointerCapture(event.pointerId);
  selectPointer(event);
});
slider.addEventListener("pointermove", event => {
  if (slider.hasPointerCapture(event.pointerId)) selectPointer(event);
});
slider.addEventListener("keydown", event => {
  const values = {ArrowDown: rc + 0.5, ArrowRight: rc + 0.5,
    ArrowUp: rc - 0.5, ArrowLeft: rc - 0.5, Home: 5, End: 30};
  if (Object.prototype.hasOwnProperty.call(values, event.key)) {
    event.preventDefault();
    selectDepth(values[event.key]);
  }
});
$("#testDepth").addEventListener("input", refresh);
$("#testDepth").addEventListener("change", refresh);
selectDepth(rc);
document.querySelectorAll(".poster-hit").forEach(button => {
  button.addEventListener("click", () => {
    const url = button.dataset.url;
    if (url) { window.open(url, "_blank", "noopener"); return; }
    button.closest("figure").nextElementSibling.textContent = "준비 중입니다";
  });
});
</script>
</body>
</html>
